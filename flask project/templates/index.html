<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} Weather</title>
    <src>  </src>
</head>
<body>

<!-- Display the weather information -->
<h1>{{ title }} Weather</h1>
<p>{{ status }} and {{ temp }} &deg;</p>
<p>Feels like {{ feels_like }} &deg;</p>
<p>Humidity is like {{ humidity }}%</p>

<p>Fetching your location and submitting the city to get the weather...</p>

<!-- Hidden form that submits automatically -->
<form id="weatherForm" action="/weather" method="GET">
    <input type="hidden" name="city" id="city" value="" />
</form>

<p id="status">Locating...</p>

<script>
    var statusElement = document.getElementById("status");

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError);
        } else {
            statusElement.innerHTML = "Geolocation is not supported by this browser.";
        }
    }

    function showPosition(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;

        statusElement.innerHTML = "Latitude: " + lat + "<br>Longitude: " + lon;

        getCity(lat, lon);
    }

    function showError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                statusElement.innerHTML = "User denied the request for Geolocation.";
                break;
            case error.POSITION_UNAVAILABLE:
                statusElement.innerHTML = "Location information is unavailable.";
                break;
            case error.TIMEOUT:
                statusElement.innerHTML = "The request to get user location timed out.";
                break;
            case error.UNKNOWN_ERROR:
                statusElement.innerHTML = "An unknown error occurred.";
                break;
        }
    }

    function getCity(lat, lon) {
        var url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data && data.address) {
                    let city = data.address.city || data.address.town || data.address.village || data.address.suburb || "Unknown location";
                    
                    // Set the city value in the hidden input
                    document.getElementById('city').value = city;
                    
                    // Submit the form automatically
                    document.getElementById('weatherForm').submit();
                } else {
                    statusElement.innerHTML += "<br>City not found.";
                }
            })
            .catch(error => {
                console.error('Error fetching city:', error);
                statusElement.innerHTML += "<br>Error fetching city.";
            });
    }

    // Trigger the geolocation when the page loads
    getLocation();
</script>

</body>
</html>
